name: Map images

# Downloads the Map Room's maps (scripts/fetch-maps.mjs) from Wikimedia Commons, public-domain images only, resizes
# them and commits anything new to assets/maps. Cloud sessions cannot reach Commons, so this runs whenever the script
# changes, on main or on a working branch, or by hand.
on:
  workflow_dispatch:
  push:
    paths: ['scripts/fetch-maps.mjs', '.github/workflows/map-images.yml']

permissions:
  contents: write

concurrency:
  group: map-images-${{ github.ref }}
  cancel-in-progress: false

jobs:
  maps:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Download
        run: |
          npm i --no-save sharp
          node scripts/fetch-maps.mjs
      - name: Publish
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/maps
          git diff --cached --quiet -- assets/maps && { echo "No new maps."; exit 0; }
          git commit -m "Map images: download from Wikimedia Commons"
          for attempt in 1 2 3; do git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0; sleep 10; done
          exit 1
