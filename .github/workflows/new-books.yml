name: New books

# Checks the books in data/new-books.js, bundles their texts into texts/bundled-gzip for good, counts their
# words and writes data/new-books-resolved.js. Runs whenever the list changes on main, or by hand.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['data/new-books.js','scripts/new-books.mjs']

permissions:
  contents: write

concurrency:
  group: library-texts   # shared with daily-room.yml: both write texts/bundled-gzip
  cancel-in-progress: false

jobs:
  bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check and bundle the books
        timeout-minutes: 35
        run: node scripts/new-books.mjs
      - name: Rebuild the book pages
        run: node scripts/book-pages.mjs
      - name: Run the tests
        run: node --test *.test.cjs
      - name: Publish
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data/new-books-resolved.js data/daily-room-texts.json texts/bundled-gzip book sitemap.xml robots.txt
          if git diff --cached --quiet; then echo "Nothing new."; exit 0; fi
          git commit -m "New books: bundle texts and reading times"
          for attempt in 1 2 3; do git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0; sleep 10; done
          exit 1
