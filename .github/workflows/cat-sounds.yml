name: Cat sounds

# Surveys freely licensed cat recordings for Clio (scripts/fetch-cat-sounds.mjs) and commits the candidates to
# assets/audio/cat-survey, to be measured and chosen from. Cloud sessions cannot reach Commons or BigSoundBank.
on:
  workflow_dispatch:
  push:
    paths: ['scripts/fetch-cat-sounds.mjs', '.github/workflows/cat-sounds.yml']

permissions:
  contents: write

concurrency:
  group: cat-sounds-${{ github.ref }}
  cancel-in-progress: false

jobs:
  survey:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Download
        run: node scripts/fetch-cat-sounds.mjs
      - name: Publish
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/audio/cat-survey
          git diff --cached --quiet -- assets/audio/cat-survey && { echo "Nothing new."; exit 0; }
          git commit -m "Cat sounds: survey candidates for Clio"
          for attempt in 1 2 3; do git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0; sleep 10; done
          exit 1
