name: Wall materials

# Temporary: lists Poly Haven's wall textures so suitable ones can be chosen.
on:
  push:
    branches: ['claude/**']
    paths: ['.github/workflows/wall-materials.yml']

permissions:
  contents: read

jobs:
  list:
    runs-on: ubuntu-latest
    steps:
      - name: List wall textures
        run: |
          node -e '
          const r=await fetch("https://api.polyhaven.com/assets?t=textures");const all=await r.json();
          for(const [id,a] of Object.entries(all)){const words=[...(a.categories||[]),...(a.tags||[])].join(" ");
            if(/plaster|wall|brick|stone|masonry|block|ashlar/i.test(words)&&!/floor|ground|road|rock_|cliff|gravel|sand$/i.test(id))
              console.log([id,(a.dimensions||[]).map(d=>d/1000+"m").join("x"),(a.categories||[]).join("|"),(a.tags||[]).join(",")].join("  "));}
          ' --input-type=module
