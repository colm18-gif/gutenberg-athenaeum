name: Temporary language counts
on:
  push:
    branches: ['claude/**']
    paths: ['.github/workflows/tmp-language-counts.yml']
permissions:
  contents: read
jobs:
  lookup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Count texts by language and list Hindi, Urdu and other South Asian texts
        run: |
          curl -sSL --max-time 180 -o pg.csv https://www.gutenberg.org/cache/epub/feeds/pg_catalog.csv
          python3 - <<'PY'
          import csv,collections
          rows=[r for r in csv.DictReader(open('pg.csv',encoding='utf-8')) if r.get('Type')=='Text']
          c=collections.Counter(l for r in rows for l in r['Language'].replace(' ','').split(';'))
          for l in ['hi','ur','bn','sa','ta','te','mr','pa','gu','ar','fa','ru','de','it','ja','ko','nl','el','la','pl','sv','fi','ga','cy','he','tl','sw','yo','af']:print(l,c.get(l,0))
          for l in ['hi','ur','bn','sa','pa','fa']:
            print('\n##',l)
            for r in rows:
              if l in r['Language'].replace(' ','').split(';'):print(' ',r['Text#'],'|',' '.join(r['Title'].split())[:80],'|',r['Authors'][:50],'|',r['Language'])
          PY
