name: Temporary Spanish lookup
on:
  push:
    branches: ['claude/**']
    paths: ['.github/workflows/tmp-spanish-lookup.yml']
permissions:
  contents: read
jobs:
  lookup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: List Spanish books by the authors of the missing titles (Project Gutenberg's catalogue)
        run: |
          curl -sSL --max-time 180 -o pg.csv https://www.gutenberg.org/cache/epub/feeds/pg_catalog.csv
          wc -l pg.csv
          cat > lookup.py <<'PY'
          import csv
          authors=['Lazarillo','Caballero, Fern','Rizal','Noli','Tenorio','Bécquer','Calderón de la Barca','Darío','Isaacs','Palma, Ricardo']
          rows=[r for r in csv.DictReader(open('pg.csv',encoding='utf-8')) if 'es' in r.get('Language','').replace(' ','').split(';') and r.get('Type')=='Text']
          print(len(rows),'Spanish texts')
          for a in authors:
            print('\n##',a)
            for r in rows:
              if a.lower() in (r['Authors']+' '+r['Title']).lower(): print(' ',r['Text#'],'|',' '.join(r['Title'].split())[:100],'|',r['Authors'][:60])
          PY
          python3 lookup.py
