name: Visitors' book service

# Deploys the visitors' book worker (worker/visitors-book) to Cloudflare, creating its storage the first time,
# and writes the worker's address into data/visitors-book-config.js so the library switches the real book on.
# Needs the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID secrets; see worker/visitors-book/README.md.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['worker/visitors-book/**']

permissions:
  contents: write

concurrency:
  group: visitors-book
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      ADMIN_TOKEN: ${{ secrets.VISITORS_BOOK_ADMIN_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Until the Cloudflare secrets are added, a push skips quietly; running it by hand says what is missing.
      - name: Check the secrets are set
        id: ready
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then echo "ok=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          echo "ok=false" >> "$GITHUB_OUTPUT"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then echo "::error::Add the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID secrets first (see worker/visitors-book/README.md)."; exit 1; fi
          echo "::notice::The visitors' book service is not set up yet (no Cloudflare secrets); nothing to deploy."
      - name: Run the tests
        if: steps.ready.outputs.ok == 'true'
        run: node --test *.test.cjs
      # Asks Cloudflare directly whether the token works and can reach Workers storage, and prints Cloudflare's own
      # answer (never the token) so a wrong token, account ID or permission is easy to spot.
      - name: Check the Cloudflare token
        if: steps.ready.outputs.ok == 'true'
        run: |
          api() { curl -sS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4$1"; }
          report() { node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{let r;try{r=JSON.parse(s)}catch(e){console.log(process.argv[1]+": no answer");process.exit(1)}
            const errs=(r.errors||[]).map(e=>e.code+" "+e.message).join("; ");console.log(process.argv[1]+": "+(r.success?"ok"+(r.result&&r.result.status?" ("+r.result.status+")":""):"failed - "+errs));process.exit(r.success?0:1)})' "$1"; }
          if [ ${#CLOUDFLARE_ACCOUNT_ID} -ne 32 ]; then echo "::warning::The account ID is ${#CLOUDFLARE_ACCOUNT_ID} characters long; a Cloudflare account ID is 32."; fi
          api /user/tokens/verify | report "Token (user)" || api "/accounts/$CLOUDFLARE_ACCOUNT_ID/tokens/verify" | report "Token (account)" || true
          api "/accounts/$CLOUDFLARE_ACCOUNT_ID" | report "Account" || true
          api "/accounts/$CLOUDFLARE_ACCOUNT_ID/storage/kv/namespaces?per_page=5" | report "Workers KV storage" || { echo "::error::Cloudflare refused the token (see the lines above). Check the token has Workers Scripts: Edit and Workers KV Storage: Edit for this account."; exit 1; }
          api "/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts" | report "Workers scripts" || { echo "::error::The token cannot manage Workers scripts; it needs Workers Scripts: Edit."; exit 1; }
      - name: Find or create the storage
        if: steps.ready.outputs.ok == 'true'
        working-directory: worker/visitors-book
        run: |
          find_id() { npx --yes wrangler@4 kv namespace list | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const list=JSON.parse(s.slice(s.indexOf("[")));const hit=list.find(n=>n.title==="library-visitors-book"||n.title.endsWith("-library-visitors-book"));process.stdout.write(hit?hit.id:"")})'; }
          id=$(find_id)
          if [ -z "$id" ]; then npx --yes wrangler@4 kv namespace create library-visitors-book; id=$(find_id); fi
          if [ -z "$id" ]; then echo "::error::Could not find or create the KV namespace."; exit 1; fi
          sed -i "s/KV_NAMESPACE_ID/$id/" wrangler.toml
      - name: Deploy the worker
        if: steps.ready.outputs.ok == 'true'
        id: deploy
        working-directory: worker/visitors-book
        run: |
          npx --yes wrangler@4 deploy | tee deploy.log
          url=$(grep -oE 'https://[a-z0-9.-]+\.workers\.dev' deploy.log | head -1)
          if [ -z "$url" ]; then echo "::error::The deploy did not report a workers.dev address. Has a workers.dev subdomain been chosen in the dashboard?"; exit 1; fi
          echo "url=$url" >> "$GITHUB_OUTPUT"
          if [ -n "$ADMIN_TOKEN" ]; then printf '%s' "$ADMIN_TOKEN" | npx --yes wrangler@4 secret put ADMIN_TOKEN; fi
      - name: Check it answers
        if: steps.ready.outputs.ok == 'true'
        # A brand-new workers.dev address can answer 404 for a minute or so while it spreads, so give it time.
        run: |
          for attempt in $(seq 1 12); do
            if body=$(curl -fsS "${{ steps.deploy.outputs.url }}/entries"); then echo "${body:0:300}"; exit 0; fi
            echo "Not answering yet (attempt $attempt); waiting."; sleep 10
          done
          echo "::error::The service did not answer at ${{ steps.deploy.outputs.url }}/entries."; exit 1
      - name: Point the library at it
        if: steps.ready.outputs.ok == 'true'
        env:
          URL: ${{ steps.deploy.outputs.url }}
        run: |
          printf '%s\n' "// Where the visitors' book service lives (worker/visitors-book). Written by .github/workflows/visitors-book.yml" \
            "// when the service is deployed. While empty, the library shows its invented visitors' book instead." \
            "window.ATHENAEUM_VISITORS_BOOK={endpoint:'$URL'};" > data/visitors-book-config.js
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -- worker/visitors-book/wrangler.toml   # the storage ID was only filled in for this deploy
          git add data/visitors-book-config.js
          if git diff --cached --quiet; then echo "Already pointing at $URL."; exit 0; fi
          git commit -m "Visitors' book: use the service at $URL"
          for attempt in 1 2 3; do git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0; sleep 10; done
          exit 1
