name: Book pages

# Rebuilds the plain web page for every book (book/*.html), the catalogue, sitemap.xml and robots.txt whenever the
# catalogue or its notes change on main. The New books workflow rebuilds them too when it adds books.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['data/**','game.js','index.html','scripts/book-pages.mjs','evening-room.js','learners-room.js','mars.js','high-staircase.js','covers/books/**']

permissions:
  contents: write

concurrency:
  group: library-texts   # shared with the jobs that change the catalogue
  cancel-in-progress: false

jobs:
  pages:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build the book pages
        run: node scripts/book-pages.mjs
      - name: Run the tests
        run: node --test *.test.cjs
      - name: Publish
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A book sitemap.xml robots.txt
          if git diff --cached --quiet; then echo "The book pages are up to date."; exit 0; fi
          git commit -m "Book pages: rebuild"
          for attempt in 1 2 3; do git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0; sleep 10; done
          exit 1
