name: Book images

# Downloads the pages of the library's fine books (the Book of Kells, the Book of Durrow, the Kelmscott Chaucer, the Fabrica)
# (scripts/fetch-book-pages.mjs), from Wikimedia Commons, public-domain images only, resizes them and commits anything
# new to assets/kells and assets/kelmscott. A book with no pages chosen yet is only surveyed, in the log. Cloud sessions
# cannot reach Commons, so this runs whenever the script changes, on main or on a working branch, or by hand.
on:
  workflow_dispatch:
  push:
    paths: ['scripts/fetch-book-pages.mjs', 'scripts/survey-whole-books.mjs', '.github/workflows/book-images.yml']

permissions:
  contents: write

concurrency:
  group: book-images-${{ github.ref }}
  cancel-in-progress: false

jobs:
  kells:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Download
        run: |
          npm i --no-save sharp
          node scripts/fetch-book-pages.mjs
      - name: Survey whole books
        if: hashFiles('scripts/survey-whole-books.mjs') != ''
        continue-on-error: true
        run: node scripts/survey-whole-books.mjs
      - name: Publish
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p assets/kelmscott assets/durrow assets/vesalius
          git add assets/kells assets/kelmscott assets/durrow assets/vesalius
          git diff --cached --quiet -- assets/kells assets/kelmscott assets/durrow assets/vesalius && { echo "No new pages."; exit 0; }
          git commit -m "Book images: download from Wikimedia Commons"
          for attempt in 1 2 3; do git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0; sleep 10; done
          exit 1
