name: Room of the Day

# Every night: check the books for the days around today, bundle their texts, drop texts for days that
# have left the two-week window, and publish the result. Can also be run by hand from the Actions tab.
on:
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:
    inputs:
      check_all:
        description: 'Only check every book in the schedule and report problems (publishes nothing)'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: daily-room
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # The script stops itself after 40 minutes and saves after every day; the step limit is a backstop.
      # Whatever was finished is still tested and published, and the next night carries on from there.
      - name: Check every book in the schedule
        if: inputs.check_all
        timeout-minutes: 60
        run: node scripts/daily-room.mjs --check-all
      - name: Check and bundle the books
        if: ${{ !inputs.check_all }}
        timeout-minutes: 45
        run: node scripts/daily-room.mjs
      - name: Run the tests
        id: tests
        if: always() && !inputs.check_all
        run: node --test *.test.cjs
      - name: Publish
        if: always() && !inputs.check_all && steps.tests.outcome == 'success'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/daily-rooms-resolved.js data/daily-room-texts.json texts/bundled-gzip
          if git diff --cached --quiet; then echo "Nothing new today."; exit 0; fi
          git commit -m "Room of the Day: books for $(date -u +%Y-%m-%d)"
          for attempt in 1 2 3; do git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0; sleep 10; done
          exit 1
