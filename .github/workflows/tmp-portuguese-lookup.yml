name: Temporary Portuguese lookup
on:
  push:
    branches: ['claude/**']
    paths: ['.github/workflows/tmp-portuguese-lookup.yml']
permissions:
  contents: read
jobs:
  lookup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: List Portuguese texts by major authors (Project Gutenberg's catalogue)
        run: |
          curl -sSL --max-time 180 -o pg.csv https://www.gutenberg.org/cache/epub/feeds/pg_catalog.csv
          cat > lookup.py <<'PY'
          import csv
          authors=['Machado de Assis','Queirós','Queiroz','Camões','Alencar','Dinis','Diniz','Azevedo, Aluísio','Azevedo, Aluizio','Garrett','Castelo Branco','Castello Branco','Pompeia','Pompéia','Almeida, Manuel','Lima Barreto','Barreto, Lima','Cunha, Euclides','Bilac','Castro Alves','Alves, Castro','Gonçalves Dias','Dias, Gonçalves','Quental','Cesário','Verde, Cesário','Pessoa','Herculano','Taunay','Macedo, Joaquim','Guimarães, Bernardo','Lobato','Espanca','Nobre, António','Gil Vicente','Vicente, Gil','Pero Vaz','Caminha','Ramalho','Oliveira Martins','Júlio Ribeiro','Ribeiro, Júlio','Varela, Fagundes','Álvares de Azevedo','Azevedo, Álvares','Raul Brandão','Brandão, Raul']
          rows=[r for r in csv.DictReader(open('pg.csv',encoding='utf-8')) if 'pt' in r.get('Language','').replace(' ','').split(';') and r.get('Type')=='Text']
          print(len(rows),'Portuguese texts')
          for a in authors:
            hits=[r for r in rows if a.lower() in r['Authors'].lower()]
            if not hits: continue
            print('\n##',a)
            for r in hits: print(' ',r['Text#'],'|',' '.join(r['Title'].split())[:95],'|',r['Authors'][:70])
          PY
          python3 lookup.py
