name: Deploy After Dark expansion

on:
  push:
    paths:
      - "after-dark-expansion-payload-*.zip"

permissions:
  contents: write

jobs:
  deploy:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out the current site
        uses: actions/checkout@v4
      - name: Expand the verified update
        run: |
          unzip -o after-dark-expansion-payload-1.zip
          unzip -o after-dark-expansion-payload-2.zip
          rm after-dark-expansion-payload-1.zip after-dark-expansion-payload-2.zip
      - name: Verify the expansion
        run: node --test *.test.cjs
      - name: Publish the expanded library
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Deploy Library After Dark expansion"
          git push
