name: Temporary Chinese lookup
on:
  push:
    branches: ['claude/**']
    paths: ['.github/workflows/tmp-chinese-lookup.yml']
permissions:
  contents: read
jobs:
  lookup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: List Chinese texts (Project Gutenberg's catalogue), with the header of a few
        run: |
          curl -sSL --max-time 180 -o pg.csv https://www.gutenberg.org/cache/epub/feeds/pg_catalog.csv
          python3 - <<'PY'
          import csv
          rows=[r for r in csv.DictReader(open('pg.csv',encoding='utf-8')) if 'zh' in r.get('Language','').replace(' ','').split(';') and r.get('Type')=='Text']
          print(len(rows),'Chinese texts')
          for r in rows: print(r['Text#'],'|',' '.join(r['Title'].split())[:60],'|',r['Authors'][:50])
          PY
          for id in 24264 23950 23962 23863 24032; do echo "== $id"; curl -sSL --max-time 30 "https://www.gutenberg.org/cache/epub/$id/pg$id.txt" | head -c 1500 | grep -E "^(Title|Author|Language|Translator|Editor)" ; done
