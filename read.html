<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Plain text · The Library After Dark</title>
<meta name="description" content="Read a book from the Library After Dark as plain text: no 3D, light on data, and kind to screen readers and older phones.">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#120d09">
<style>
  /* The plain text reader: one book as a single readable column, for older phones, slow connections, screen readers and
     school computers. It remembers the reader's place in the same way as the 3D reader, so the two keep one bookmark. */
  :root{--bg:#f4ecd8;--ink:#2a2118;--soft:#6e5d48;--rule:#d8c9a8;--link:#7a4a14;--size:19px;--face:Georgia,'Iowan Old Style','Times New Roman',serif}
  :root[data-tone=night]{--bg:#15110d;--ink:#e6d9c0;--soft:#a8977c;--rule:#3a2f24;--link:#e3b36a}
  :root[data-tone=white]{--bg:#ffffff;--ink:#1a1a1a;--soft:#555;--rule:#ddd;--link:#1a4f8a}
  :root[data-face=clear]{--face:system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif}
  *{box-sizing:border-box}
  html{background:var(--bg)}
  body{margin:0;color:var(--ink);background:var(--bg);font:var(--size)/1.65 var(--face)}
  a{color:var(--link)}
  .bar{position:sticky;top:0;z-index:2;display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;justify-content:space-between;padding:8px 16px;background:var(--bg);border-bottom:1px solid var(--rule);font:15px/1.3 system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif}
  .bar a{text-decoration:none}
  .tools{display:flex;gap:6px;flex-wrap:wrap}
  .tools button{min-width:44px;min-height:40px;padding:4px 10px;border:1px solid var(--rule);border-radius:6px;background:transparent;color:var(--ink);font:inherit;cursor:pointer}
  .tools button:focus-visible,a:focus-visible{outline:3px solid var(--link);outline-offset:2px}
  .progress{height:3px;background:var(--link);width:0;position:fixed;left:0;top:0;z-index:3}
  main{max-width:38em;margin:0 auto;padding:28px 18px 80px}
  header.book h1{font-size:1.7em;line-height:1.2;margin:.4em 0 .2em}
  header.book p{margin:0;color:var(--soft)}
  .credit{font-size:.8em;color:var(--soft);border-top:1px solid var(--rule);margin-top:2.4em;padding-top:1em}
  article p{margin:0 0 1em}
  article p.head{font-weight:bold;text-align:center;margin:2em 0 1em;letter-spacing:.03em}
  :lang(zh) article p{text-indent:2em}
  .status{color:var(--soft);font-style:italic}
  .resume{display:none;margin:1em 0;padding:10px 14px;border:1px solid var(--rule);border-radius:6px}
  .resume.shown{display:block}
</style>
</head>
<body>
<div class="progress" id="progress" aria-hidden="true"></div>
<nav class="bar" aria-label="Reading controls">
  <a href="/" id="home">The Library After Dark</a>
  <div class="tools">
    <button type="button" id="smaller" aria-label="Smaller text">A−</button>
    <button type="button" id="larger" aria-label="Larger text">A+</button>
    <button type="button" id="tone" aria-label="Change the page colour">Page</button>
    <button type="button" id="face" aria-label="Change the typeface">Aa</button>
  </div>
</nav>
<main>
  <header class="book"><h1 id="title">A book from the library</h1><p id="author"></p><p><a id="page" href="/book/">About this book</a> · <a id="walk" href="/">Read it in the 3D library</a></p></header>
  <p class="resume" id="resume"><a href="#" id="resumeLink">Carry on where you left off</a></p>
  <p class="status" id="status" role="status">Fetching the text…</p>
  <article id="text" aria-live="off"></article>
  <p class="credit" id="credit"></p>
</main>
<script>
(()=>{
  'use strict';
  const $=id=>document.getElementById(id),root=document.documentElement,id=Number(new URLSearchParams(location.search).get('book'));
  const store={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
  // Reading comfort, kept for next time.
  let size=Number(store.get('athenaeum-plain-size'))||19;const tones=['paper','night','white'];let tone=store.get('athenaeum-plain-tone')||'paper',face=store.get('athenaeum-plain-face')||'classic';
  const apply=()=>{root.style.setProperty('--size',size+'px');root.dataset.tone=tone;root.dataset.face=face;store.set('athenaeum-plain-size',size);store.set('athenaeum-plain-tone',tone);store.set('athenaeum-plain-face',face)};apply();
  $('smaller').onclick=()=>{size=Math.max(14,size-1);apply()};$('larger').onclick=()=>{size=Math.min(32,size+1);apply()};
  $('tone').onclick=()=>{tone=tones[(tones.indexOf(tone)+1)%tones.length];apply()};$('face').onclick=()=>{face=face==='clear'?'classic':'clear';apply()};
  if(!Number.isInteger(id)||id<=0){$('status').textContent='No book was chosen. Pick one from the catalogue.';$('page').href='/book/';return}
  $('walk').href='/?book='+id;
  // The same bookmark as the 3D reader: a fraction of the way through the book.
  const KEY='athenaeum-progress-'+id;
  const saved=(()=>{try{const v=JSON.parse(store.get(KEY)||'null');return v&&typeof v.p==='number'&&v.p>0&&v.p<1?v.p:0}catch(e){return 0}})();
  async function bundled(){if(typeof DecompressionStream==='undefined')return'';try{const r=await fetch(`texts/bundled-gzip/pg${id}.txt.gz`);if(!r.ok)return'';return await new Response(r.body.pipeThrough(new DecompressionStream('gzip'))).text()}catch(e){return''}}
  async function plain(url){try{const r=await fetch(url);if(!r.ok)return'';const t=await r.text();return t.length>500&&!/^\s*</.test(t)?t:''}catch(e){return''}}
  async function fetchText(){
    for(const get of [bundled,()=>plain(`texts/pg${id}.txt`),()=>plain(`https://www.gutenberg.org/cache/epub/${id}/pg${id}.txt`),()=>plain(`https://www.gutenberg.org/ebooks/${id}.txt.utf-8`)]){const t=await get();if(t&&t.length>500)return t}
    return'';
  }
  const field=(text,name)=>(text.slice(0,4000).match(new RegExp('^'+name+':\\s*(.+)$','m'))||[])[1]?.trim()||'';
  const LANGS={English:'en',Spanish:'es',Portuguese:'pt',French:'fr',Latin:'la',Chinese:'zh-Hant',Ukrainian:'uk',German:'de',Italian:'it'};
  function body(text){
    const start=text.search(/\*\*\* ?START OF (THE|THIS) (PROJECT GUTENBERG EBOOK|WIKISOURCE TEXT)/i);if(start>=0)text=text.slice(text.indexOf('\n',start)+1);
    const end=text.search(/\*\*\* ?END OF (THE|THIS) (PROJECT GUTENBERG EBOOK|WIKISOURCE TEXT)/i);if(end>1000)text=text.slice(0,end);
    return text.replace(/\r/g,'').trim();
  }
  function render(text,lang){
    const cjk=/^zh/.test(lang),frag=document.createDocumentFragment();
    for(const block of text.split(/\n\s*\n/)){
      const lines=block.split('\n').map(l=>l.trim()).filter(Boolean);if(!lines.length)continue;
      const p=document.createElement('p'),joined=lines.join(cjk?'':' ');
      // Short lines in capitals, or "CHAPTER …", read as headings.
      if(joined.length<80&&(/^(chapter|book|part|canto|act|scene|capítulo|chapitre|livre|розділ|частина)\b/i.test(joined)||(joined===joined.toUpperCase()&&/[A-ZÀ-ÞА-Я]/.test(joined))))p.className='head';
      // Poetry, and lists such as a table of contents, keep their lines; prose (wrapped at about 70 characters) flows.
      if(lines.length>1&&!cjk&&(lines.reduce((n,l)=>n+l.length,0)/lines.length<50||lines.filter(l=>/^(chapter|book|part|canto|act|letter|[ivxlc]+\.|\d+\.)\s/i.test(l)).length>=2)){lines.forEach((l,i)=>{if(i)p.append(document.createElement('br'));p.append(l)})}else p.textContent=joined;
      frag.append(p);
    }
    $('text').append(frag);
  }
  function track(){
    const bar=$('progress');let last=0;
    const at=()=>{const max=document.documentElement.scrollHeight-innerHeight;return max>0?Math.min(1,Math.max(0,scrollY/max)):0};
    addEventListener('scroll',()=>{const p=at();bar.style.width=(p*100)+'%';const now=Date.now();if(now-last>1500&&p>0.001){last=now;store.set(KEY,JSON.stringify({p,n:100}))}},{passive:true});
    addEventListener('pagehide',()=>{const p=at();if(p>0.001)store.set(KEY,JSON.stringify({p,n:100}))});
  }
  fetchText().then(raw=>{
    if(!raw){$('status').textContent='The text could not be fetched just now. Try again in a moment, or read it in the 3D library.';return}
    const title=field(raw,'Title')||'A book from the library',author=field(raw,'Author'),language=field(raw,'Language'),lang=LANGS[language.split(/[,;]/)[0].trim()]||'en';
    document.title=`${title} · Plain text · The Library After Dark`;root.lang=lang;$('title').textContent=title;$('author').textContent=author;
    const source=(raw.slice(0,3000).match(/^Source: Wikisource, (\S+)/m)||[])[1];
    $('credit').innerHTML='';const credit=document.createElement('span');
    if(source){credit.append('Text from Wikisource, in the public domain: ');const a=document.createElement('a');a.href=source;a.textContent=source;credit.append(a)}
    else{credit.append('Project Gutenberg eBook #'+id+', in the public domain: ');const a=document.createElement('a');a.href='https://www.gutenberg.org/ebooks/'+id;a.textContent='gutenberg.org/ebooks/'+id;credit.append(a)}
    $('credit').append(credit);
    $('status').remove();render(body(raw),lang);track();
    if(saved>0.002){$('resume').classList.add('shown');$('resumeLink').textContent=`Carry on where you left off (${Math.round(saved*100)}% of the way through)`;
      $('resumeLink').onclick=e=>{e.preventDefault();scrollTo(0,saved*(document.documentElement.scrollHeight-innerHeight));$('resume').classList.remove('shown')}}
  });
  // The book's own page, when the link came from one.
  const from=new URLSearchParams(location.search).get('from')||'';if(/^[^/?#]+\.html$/.test(from))$('page').href='/book/'+encodeURIComponent(from);
})();
</script>
</body>
</html>
